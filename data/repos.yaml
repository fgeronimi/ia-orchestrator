# Repos surveillés par l'orchestrateur (un tour de poll les balaye tous).
# Une entrée est soit 'owner/nom', soit un mapping avec config :
#   - repo: owner/nom
#     timeout: 900        # borne des appels Claude pour ce repo (défaut 600 s)
# Sans ce fichier, poll.py retombe sur WATCHED_REPO du .env (un seul repo).
# Le PAT (GITHUB_TOKEN) doit être scopé sur chaque repo listé.
repos:
  - fgeronimi/ia-orchestrator
  - repo: fgeronimi/havre-data
    timeout: 900
  - repo: fgeronimi/havre-app
    timeout: 1200         # pnpm install d'un monorepo froid sur le Pi
  - repo: fgeronimi/havre-mesure
    timeout: 900
  - fgeronimi/havre-infra    # Terraform : l'agent review/édite, n'applique jamais (pas d'auth GCP sur le Pi)
  - fgeronimi/fgeronimi.github.io
